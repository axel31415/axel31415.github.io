<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable | Axel Brunon</title><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face{font-family:'Fraunces';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/fraunces-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2')}
:root{--bg:#0e1015;--ink:#f3f4f6;--soft:#c8ccd4;--mute:#959baa;--line:#2a2f3a;--accent:#4fd1f5;--action:#fe7e01;--action-hover:#feae3f;--on-action:#1a0d00;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f4f7fc;--ink:#0e1830;--soft:#3b4966;--mute:#63728f;--line:#d3ddec;--accent:#0a7bb0;--action:#c55300;--action-hover:#a94600;--on-action:#fff;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{width:min(1160px,100% - 32px);margin-inline:auto}
header{border-bottom:1px solid var(--line)}
header .wrap{height:64px;display:flex;align-items:center}
.brand{text-decoration:none;color:inherit}
.brand b{display:block;font-family:'Fraunces',Georgia,serif;font-size:1.2rem;line-height:1.1}
.brand small{color:var(--mute);font-size:.78rem}
main{flex:1;display:grid;align-items:center;padding:64px 0}
.code{display:block;font:600 .8rem 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(2rem,1.4rem + 2.6vw,3.2rem);line-height:1.1;margin:0;max-width:18ch;letter-spacing:-.01em}
p{color:var(--soft);font-size:1.15rem;max-width:52ch;margin:20px 0 32px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:12px 22px;border-radius:10px;font-weight:600;text-decoration:none;background:var(--action);color:var(--on-action)}
.btn:hover{background:var(--action-hover)}
.link-alt{color:var(--soft);font-weight:500;text-underline-offset:4px;text-decoration-color:var(--line)}
.link-alt:hover{color:var(--ink);text-decoration-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style></head><body>
<header><div class="wrap"><a class="brand" href="/"><b>Axel Brunon</b><small>Bras droit | COO externalisé</small></a></div></header>
<main><div class="wrap">
  <span class="code">Erreur 404</span>
  <h1>Cette page n'existe pas, ou plus.</h1>
  <p>Le lien est peut-être ancien, ou l'adresse contient une faute de frappe. Tu trouveras tout le reste depuis l'accueil.</p>
  <div class="actions">
    <a class="btn" href="/">Retour à l'accueil</a>
    <a class="link-alt" href="/blog/">Lire les articles du blog</a>
  </div>
</div></main>
</body></html>
